<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="한시겸과 류이한의 낮과 밤 캐릭터 프로필">
<title>한시겸 · 류이한</title>
<style>
html, body {
  margin: 0;
  min-width: 320px;
  min-height: 100%;
  background: #ebe9ff;
}

body { min-height: 100vh; }

@font-face {
  font-family: "SchoolSafetyRoundedSmile";
  src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimDunggeunmisoTTF-R.woff2") format("woff2");
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: "SchoolSafetyRoundedSmile";
  src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimDunggeunmisoTTF-B.woff2") format("woff2");
  font-weight: 500;
  font-display: swap;
}

#si-gyeom-ihan-profile {
  --page-ink: #28304b;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: 100%;
  min-height: 760px;
  padding: 64px clamp(18px, 5vw, 64px);
  box-sizing: border-box;
  font-family: "SchoolSafetyRoundedSmile", sans-serif;
  color: var(--page-ink);
  background: #ebe9ff;
}

#si-gyeom-ihan-profile * { box-sizing: border-box; }

#si-gyeom-ihan-profile .sky {
  position: absolute;
  z-index: -3;
  top: -18%;
  bottom: -18%;
  width: 72%;
  opacity: 1;
  transition: background 1s ease, filter 1s ease, opacity 1s ease;
}

#si-gyeom-ihan-profile .sky-left {
  left: -12%;
  -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 58%, transparent 100%);
  mask-image: linear-gradient(90deg, #000 0%, #000 58%, transparent 100%);
}

#si-gyeom-ihan-profile .sky-right {
  right: -12%;
  -webkit-mask-image: linear-gradient(270deg, #000 0%, #000 58%, transparent 100%);
  mask-image: linear-gradient(270deg, #000 0%, #000 58%, transparent 100%);
}

#si-gyeom-ihan-profile .sky.day {
  background:
    radial-gradient(circle at 18% 18%, rgba(255, 239, 158, .98) 0 9%, transparent 30%),
    radial-gradient(circle at 78% 22%, rgba(140, 236, 255, .92) 0 13%, transparent 36%),
    radial-gradient(circle at 52% 52%, rgba(218, 147, 255, .84) 0 18%, transparent 47%),
    radial-gradient(circle at 30% 78%, rgba(255, 151, 204, .83) 0 17%, transparent 42%),
    linear-gradient(145deg, #fff9e8 4%, #c6f7ff 34%, #dec8ff 65%, #ffd5eb 100%);
  filter: saturate(1.12) brightness(1.04);
}

#si-gyeom-ihan-profile .sky.day::after {
  content: "";
  position: absolute;
  inset: 8% -10%;
  background: conic-gradient(from 105deg at 46% 50%, transparent 0 14%, rgba(255,255,255,.65) 19%, rgba(113,239,255,.46) 26%, rgba(206,135,255,.42) 34%, rgba(255,157,206,.36) 42%, transparent 55% 100%);
  filter: blur(34px);
  transform: rotate(-9deg) scale(1.2);
}

#si-gyeom-ihan-profile .sky.night {
  background:
    radial-gradient(circle at 30% 22%, rgba(118, 92, 255, .82) 0 10%, transparent 30%),
    radial-gradient(circle at 68% 56%, rgba(203, 90, 255, .56) 0 12%, transparent 33%),
    radial-gradient(circle at 40% 82%, rgba(53, 159, 255, .56) 0 12%, transparent 38%),
    linear-gradient(145deg, #060923 0%, #11194e 35%, #27145e 68%, #080b2e 100%);
  filter: saturate(1.12);
}

#si-gyeom-ihan-profile .sky.night::before,
#si-gyeom-ihan-profile .sky.night::after {
  content: "";
  position: absolute;
  inset: 0;
}

#si-gyeom-ihan-profile .sky.night::before {
  opacity: .9;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.95) 0 1.2px, transparent 1.8px),
    radial-gradient(circle, rgba(189,220,255,.85) 0 1px, transparent 1.6px),
    radial-gradient(circle, rgba(255,194,250,.78) 0 1px, transparent 1.5px);
  background-size: 71px 83px, 109px 127px, 151px 139px;
  background-position: 8px 14px, 42px 9px, 31px 77px;
}

#si-gyeom-ihan-profile .sky.night::after {
  inset: 4% -20%;
  background: linear-gradient(118deg, transparent 28%, rgba(124,190,255,.12) 38%, rgba(255,255,255,.52) 49%, rgba(219,122,255,.25) 58%, transparent 70%);
  filter: blur(22px);
  transform: rotate(-8deg);
}

#si-gyeom-ihan-profile .mist {
  position: absolute;
  z-index: -2;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at center, rgba(255,255,255,.22) 0%, rgba(255,255,255,.08) 27%, transparent 63%),
    linear-gradient(90deg, transparent 38%, rgba(240,236,255,.16) 50%, transparent 62%);
  backdrop-filter: blur(2px);
}

#si-gyeom-ihan-profile .point-stars {
  position: absolute;
  width: 124px;
  height: 74px;
  z-index: 0;
  font-family: Georgia, "Times New Roman", serif;
  pointer-events: none;
}

#si-gyeom-ihan-profile .point-stars .glyph {
  position: absolute;
  display: block;
  line-height: 1;
  text-align: center;
}

#si-gyeom-ihan-profile .point-stars .main { left: 47px; top: 18px; font-size: 30px; }
#si-gyeom-ihan-profile .point-stars .diamond { left: 20px; top: 8px; font-size: 18px; transform: rotate(-8deg); }
#si-gyeom-ihan-profile .point-stars .four { right: 15px; top: 4px; font-size: 16px; }
#si-gyeom-ihan-profile .point-stars .little-a { left: 8px; bottom: 14px; font-size: 13px; }
#si-gyeom-ihan-profile .point-stars .little-b { right: 5px; bottom: 12px; font-size: 12px; }
#si-gyeom-ihan-profile .point-stars .dot-a { left: 40px; top: 2px; font-size: 12px; }
#si-gyeom-ihan-profile .point-stars .dot-b { right: 38px; bottom: 3px; font-size: 11px; }

#si-gyeom-ihan-profile .point-stars .arc {
  position: absolute;
  left: 16px;
  top: 37px;
  width: 92px;
  height: 26px;
  border-top: 1px solid currentColor;
  border-radius: 50%;
  transform: rotate(-5deg);
  opacity: .6;
}

#si-gyeom-ihan-profile .page-point {
  z-index: -1;
  opacity: .86;
}

#si-gyeom-ihan-profile .page-point[data-tone="day"] .glyph,
#si-gyeom-ihan-profile .page-point[data-tone="day"] .arc,
#si-gyeom-ihan-profile .profile-card[data-state="day"] .point-stars .glyph,
#si-gyeom-ihan-profile .profile-card[data-state="day"] .point-stars .arc {
  color: rgba(255,255,255,.98);
  text-shadow: 0 0 5px rgba(255,255,255,1), 0 0 12px rgba(104,224,255,.95), 0 0 21px rgba(217,124,255,.78);
}

#si-gyeom-ihan-profile .page-point[data-tone="night"] .glyph,
#si-gyeom-ihan-profile .page-point[data-tone="night"] .arc,
#si-gyeom-ihan-profile .profile-card[data-state="night"] .point-stars .glyph,
#si-gyeom-ihan-profile .profile-card[data-state="night"] .point-stars .arc {
  color: rgba(250,249,255,1);
  text-shadow: 0 0 5px rgba(255,255,255,1), 0 0 13px rgba(128,181,255,1), 0 0 24px rgba(194,94,255,.94);
}

#si-gyeom-ihan-profile .page-left-top { left: 1.2%; top: 4px; transform: rotate(-8deg); }
#si-gyeom-ihan-profile .page-left-bottom { left: 3%; bottom: 2px; transform: scale(.82) rotate(7deg); }
#si-gyeom-ihan-profile .page-center-top { left: calc(50% - 62px); top: 3px; transform: scale(.7); }
#si-gyeom-ihan-profile .page-center-bottom { left: calc(50% - 62px); bottom: 1px; transform: scale(.62) rotate(-9deg); }
#si-gyeom-ihan-profile .page-right-top { right: 1.2%; top: 5px; transform: rotate(8deg); }
#si-gyeom-ihan-profile .page-right-bottom { right: 3%; bottom: 2px; transform: scale(.82) rotate(-7deg); }

#si-gyeom-ihan-profile .profile-card > .card-point-top {
  z-index: 4;
  right: -21px;
  top: -10px;
  transform: scale(.64) rotate(8deg);
  transform-origin: right top;
  opacity: .92;
}

#si-gyeom-ihan-profile .profile-card > .card-point-bottom {
  z-index: 4;
  left: -27px;
  bottom: -13px;
  transform: scale(.56) rotate(-9deg);
  transform-origin: left bottom;
  opacity: .82;
}

#si-gyeom-ihan-profile .profiles {
  position: relative;
  width: min(100%, 1180px);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 32px;
}

#si-gyeom-ihan-profile .profile-card {
  position: relative;
  overflow: hidden;
  min-width: 0;
  padding: 22px;
  border-radius: 30px;
  border: 1px solid rgba(255,255,255,.75);
  transition: color .8s ease, background .8s ease, border-color .8s ease, box-shadow .8s ease;
}

#si-gyeom-ihan-profile .profile-card::after {
  content: "";
  position: absolute;
  z-index: -1;
  inset: -34%;
  opacity: .58;
  transition: opacity .8s ease, background .8s ease, transform 1s ease;
  pointer-events: none;
}

#si-gyeom-ihan-profile .profile-card[data-state="day"] {
  color: #313553;
  background: linear-gradient(150deg, rgba(255,255,255,.91), rgba(255,248,255,.76));
  border-color: rgba(255,255,255,.92);
  box-shadow: 0 28px 80px rgba(102,89,174,.24), inset 0 0 0 1px rgba(255,255,255,.38);
}

#si-gyeom-ihan-profile .profile-card[data-state="day"]::after {
  background: conic-gradient(from 160deg, rgba(255,224,131,.42), rgba(117,231,255,.42), rgba(200,131,255,.42), rgba(255,153,204,.36), rgba(255,224,131,.42));
  transform: rotate(-8deg);
}

#si-gyeom-ihan-profile .profile-card[data-state="night"] {
  color: #f5f1ff;
  background: linear-gradient(150deg, rgba(12,16,50,.9), rgba(33,18,75,.83));
  border-color: rgba(189,179,255,.46);
  box-shadow: 0 30px 88px rgba(4,6,28,.55), 0 0 42px rgba(120,93,255,.26), inset 0 0 0 1px rgba(255,255,255,.07);
}

#si-gyeom-ihan-profile .profile-card[data-state="night"] .name,
#si-gyeom-ihan-profile .profile-card[data-state="night"] .quote,
#si-gyeom-ihan-profile .profile-card[data-state="night"] .keyword,
#si-gyeom-ihan-profile .profile-card[data-state="night"] .state-switch button {
  color: #faf7ff;
}

#si-gyeom-ihan-profile .profile-card[data-state="night"] .meta {
  color: #e6e0fa;
  opacity: .82;
}

#si-gyeom-ihan-profile .profile-card[data-state="night"] .quote {
  text-shadow: 0 2px 16px rgba(122,112,255,.32);
}

#si-gyeom-ihan-profile .profile-card[data-state="day"] .name,
#si-gyeom-ihan-profile .profile-card[data-state="day"] .meta,
#si-gyeom-ihan-profile .profile-card[data-state="day"] .quote,
#si-gyeom-ihan-profile .profile-card[data-state="day"] .keyword,
#si-gyeom-ihan-profile .profile-card[data-state="day"] .state-switch button {
  color: #313553;
}

#si-gyeom-ihan-profile .profile-card[data-state="night"]::after {
  background: radial-gradient(circle at 25% 22%, rgba(84,165,255,.48), transparent 28%), radial-gradient(circle at 72% 62%, rgba(201,92,255,.45), transparent 32%);
  transform: rotate(7deg);
}

#si-gyeom-ihan-profile .portrait {
  position: relative;
  z-index: 1;
  width: 100%;
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: 22px;
  background: rgba(255,255,255,.18);
  box-shadow: 0 16px 42px rgba(14,13,41,.18);
}

#si-gyeom-ihan-profile .portrait img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transform: scale(1.018);
  transition: opacity .5s ease, transform .8s ease;
}

#si-gyeom-ihan-profile .portrait img.is-visible {
  opacity: 1;
  transform: scale(1);
}

#si-gyeom-ihan-profile .han-day { object-position: 50% 22%; }
#si-gyeom-ihan-profile .han-night { object-position: 50% 20%; }
#si-gyeom-ihan-profile .ryu-day { object-position: 50% 25%; }
#si-gyeom-ihan-profile .ryu-night { object-position: 50% 22%; }

#si-gyeom-ihan-profile .card-body {
  position: relative;
  z-index: 1;
  padding: 22px 6px 5px;
}

#si-gyeom-ihan-profile .identity-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
}

#si-gyeom-ihan-profile .name {
  margin: 0;
  font-size: clamp(30px, 4vw, 42px);
  line-height: 1.08;
  font-weight: 500;
  letter-spacing: -.04em;
}

#si-gyeom-ihan-profile .meta {
  margin: 8px 0 0;
  font-size: 15px;
  line-height: 1.45;
  opacity: .72;
  word-break: keep-all;
}

#si-gyeom-ihan-profile .state-switch {
  --switch-x: 0%;
  position: relative;
  flex: 0 0 148px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 4px;
  border-radius: 999px;
  background: rgba(111,101,156,.12);
  box-shadow: inset 0 0 0 1px rgba(120,111,161,.16);
}

#si-gyeom-ihan-profile .profile-card[data-state="night"] .state-switch {
  background: rgba(255,255,255,.09);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.10);
}

#si-gyeom-ihan-profile .state-switch::before {
  content: "";
  position: absolute;
  top: 4px;
  bottom: 4px;
  left: 4px;
  width: calc(50% - 4px);
  border-radius: 999px;
  background: rgba(255,255,255,.9);
  box-shadow: 0 4px 14px rgba(46,39,82,.18);
  transform: translateX(var(--switch-x));
  transition: transform .45s cubic-bezier(.2,.78,.2,1), background .8s ease;
}

#si-gyeom-ihan-profile .profile-card[data-state="night"] .state-switch::before {
  background: linear-gradient(135deg, #6965d9, #8d58c9);
}

#si-gyeom-ihan-profile .state-switch[data-active="night"] { --switch-x: 100%; }

#si-gyeom-ihan-profile .state-switch button {
  position: relative;
  z-index: 1;
  min-height: 38px;
  padding: 0 10px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: .05em;
  opacity: .5;
}

#si-gyeom-ihan-profile .state-switch button[aria-pressed="true"] { opacity: 1; }

#si-gyeom-ihan-profile .keywords {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 22px 0 0;
  min-height: 38px;
}

#si-gyeom-ihan-profile .keyword {
  padding: 8px 12px;
  border-radius: 999px;
  font-size: 15px;
  line-height: 1;
  font-weight: 500;
  background: rgba(119,100,181,.11);
  box-shadow: inset 0 0 0 1px rgba(102,85,164,.12);
  transition: opacity .28s ease, transform .28s ease, background .8s ease;
}

#si-gyeom-ihan-profile .profile-card[data-state="night"] .keyword {
  background: rgba(173,158,255,.13);
  box-shadow: inset 0 0 0 1px rgba(211,203,255,.12);
}

#si-gyeom-ihan-profile .quote {
  margin: 20px 0 2px;
  min-height: 58px;
  font-size: clamp(18px, 2.15vw, 22px);
  line-height: 1.48;
  font-weight: 400;
  letter-spacing: -.02em;
  word-break: keep-all;
  transition: opacity .28s ease, transform .28s ease;
}

#si-gyeom-ihan-profile .quote::before { content: "“"; opacity: .55; }
#si-gyeom-ihan-profile .quote::after { content: "”"; opacity: .55; }

#si-gyeom-ihan-profile .is-changing .keyword,
#si-gyeom-ihan-profile .is-changing .quote {
  opacity: 0;
  transform: translateY(5px);
}

@media (max-width: 760px) {
  #si-gyeom-ihan-profile {
    min-height: 0;
    padding: 36px 16px;
  }
  #si-gyeom-ihan-profile .profiles { grid-template-columns: 1fr; gap: 24px; }
  #si-gyeom-ihan-profile .sky { width: 130%; height: 64%; bottom: auto; }
  #si-gyeom-ihan-profile .sky-left {
    left: -15%;
    top: -8%;
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 64%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 0%, #000 64%, transparent 100%);
  }
  #si-gyeom-ihan-profile .sky-right {
    right: -15%;
    top: 45%;
    -webkit-mask-image: linear-gradient(0deg, #000 0%, #000 64%, transparent 100%);
    mask-image: linear-gradient(0deg, #000 0%, #000 64%, transparent 100%);
  }
  #si-gyeom-ihan-profile .profile-card { padding: 16px; border-radius: 25px; }
  #si-gyeom-ihan-profile .portrait { border-radius: 19px; }
  #si-gyeom-ihan-profile .identity-row { align-items: center; }
  #si-gyeom-ihan-profile .state-switch { flex-basis: 132px; }
  #si-gyeom-ihan-profile .card-body { padding: 18px 3px 4px; }
  #si-gyeom-ihan-profile .page-center-top,
  #si-gyeom-ihan-profile .page-center-bottom { display: none; }
  #si-gyeom-ihan-profile .profile-card > .card-point-top { transform: scale(.52) rotate(8deg); }
  #si-gyeom-ihan-profile .profile-card > .card-point-bottom { transform: scale(.46) rotate(-9deg); }
}

@media (max-width: 410px) {
  #si-gyeom-ihan-profile .identity-row { display: block; }
  #si-gyeom-ihan-profile .state-switch { width: 144px; margin-top: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  #si-gyeom-ihan-profile *,
  #si-gyeom-ihan-profile *::before,
  #si-gyeom-ihan-profile *::after { transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<section id="si-gyeom-ihan-profile" aria-label="한시겸과 류이한 낮밤 프로필">
  <div class="sky sky-left day" aria-hidden="true"></div>
  <div class="sky sky-right day" aria-hidden="true"></div>
  <div class="mist" aria-hidden="true"></div>

  <div class="point-stars page-point page-left-top" data-side="han" data-tone="day" aria-hidden="true">
    <span class="arc"></span><span class="glyph main">✦</span><span class="glyph diamond">✧</span><span class="glyph four">⋆</span><span class="glyph little-a">✦</span><span class="glyph little-b">✧</span><span class="glyph dot-a">·</span><span class="glyph dot-b">˚</span>
  </div>
  <div class="point-stars page-point page-left-bottom" data-side="han" data-tone="day" aria-hidden="true">
    <span class="arc"></span><span class="glyph main">✦</span><span class="glyph diamond">✧</span><span class="glyph four">⋆</span><span class="glyph little-a">✦</span><span class="glyph little-b">✧</span><span class="glyph dot-a">·</span><span class="glyph dot-b">˚</span>
  </div>
  <div class="point-stars page-point page-center-top" data-side="han" data-tone="day" aria-hidden="true">
    <span class="arc"></span><span class="glyph main">✦</span><span class="glyph diamond">✧</span><span class="glyph four">⋆</span><span class="glyph little-a">✦</span><span class="glyph little-b">✧</span><span class="glyph dot-a">·</span><span class="glyph dot-b">˚</span>
  </div>
  <div class="point-stars page-point page-center-bottom" data-side="ryu" data-tone="day" aria-hidden="true">
    <span class="arc"></span><span class="glyph main">✦</span><span class="glyph diamond">✧</span><span class="glyph four">⋆</span><span class="glyph little-a">✦</span><span class="glyph little-b">✧</span><span class="glyph dot-a">·</span><span class="glyph dot-b">˚</span>
  </div>
  <div class="point-stars page-point page-right-top" data-side="ryu" data-tone="day" aria-hidden="true">
    <span class="arc"></span><span class="glyph main">✦</span><span class="glyph diamond">✧</span><span class="glyph four">⋆</span><span class="glyph little-a">✦</span><span class="glyph little-b">✧</span><span class="glyph dot-a">·</span><span class="glyph dot-b">˚</span>
  </div>
  <div class="point-stars page-point page-right-bottom" data-side="ryu" data-tone="day" aria-hidden="true">
    <span class="arc"></span><span class="glyph main">✦</span><span class="glyph diamond">✧</span><span class="glyph four">⋆</span><span class="glyph little-a">✦</span><span class="glyph little-b">✧</span><span class="glyph dot-a">·</span><span class="glyph dot-b">˚</span>
  </div>

  <div class="profiles">
    <article class="profile-card" data-character="han" data-state="day">
      <div class="point-stars card-point-top" aria-hidden="true">
        <span class="arc"></span><span class="glyph main">✦</span><span class="glyph diamond">✧</span><span class="glyph four">⋆</span><span class="glyph little-a">✦</span><span class="glyph little-b">✧</span><span class="glyph dot-a">·</span><span class="glyph dot-b">˚</span>
      </div>
      <div class="point-stars card-point-bottom" aria-hidden="true">
        <span class="arc"></span><span class="glyph main">✦</span><span class="glyph diamond">✧</span><span class="glyph four">⋆</span><span class="glyph little-a">✦</span><span class="glyph little-b">✧</span><span class="glyph dot-a">·</span><span class="glyph dot-b">˚</span>

      <div class="card-body">
        <div class="identity-row">
          <div>
            <h2 class="name">류이한</h2>
            <p class="meta">27세 · 현역 아이돌 · ISTP · 8w7</p>
          </div>
          <div class="state-switch cursor-interaction" data-active="day" role="group" aria-label="류이한 낮밤 선택">

      </div>

  </div>
</section>

<script>
(() => {
  const root = document.getElementById('si-gyeom-ihan-profile');
  const copy = {
    han: {
      day: { keywords: ['차분한', '다정한', '책임감', '절제형'], quote: '시간 괜찮으면 같이 먹을래?' },
      night: { keywords: ['직설적인', '솔직한', '집요한', '독점욕'], quote: '오늘은 나랑 있었으면 좋겠어.' }
    },
    ryu: {
      day: { keywords: ['까칠한', '도발적인', '자존심', '경계형'], quote: '누가 기다렸대. 그냥 안 자고 있었던 거지.' },
      night: { keywords: ['조용한', '솔직한', '낮은 경계', '짧은 진심'], quote: '응. 보고 싶었어.' }
    }
  };

  function paint(card, state, immediate = false) {
    const who = card.dataset.character;
    const switcher = card.querySelector('.state-switch');
    const update = () => {
      card.dataset.state = state;
      switcher.dataset.active = state;
      switcher.querySelectorAll('button').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.setState === state));
      });
      card.querySelectorAll('.portrait img').forEach(image => {
        image.classList.toggle('is-visible', image.classList.contains(`${who}-${state}`));
      });
      card.querySelector('.keywords').innerHTML = copy[who][state].keywords
        .map(word => `<span class="keyword">${word}</span>`).join('');
      card.querySelector('.quote').textContent = copy[who][state].quote;
      root.querySelector(who === 'han' ? '.sky-left' : '.sky-right').className = `sky ${who === 'han' ? 'sky-left' : 'sky-right'} ${state}`;
      root.querySelectorAll(`.page-point[data-side="${who}"]`).forEach(point => {
        point.dataset.tone = state;
      });
      card.classList.remove('is-changing');
    };
    if (immediate) update();
    else {
      card.classList.add('is-changing');
      window.setTimeout(update, 190);
    }
  }

  root.querySelectorAll('.profile-card').forEach(card => {
    paint(card, card.dataset.state, true);
    card.querySelectorAll('[data-set-state]').forEach(button => {
      button.addEventListener('click', () => {
        const next = button.dataset.setState;
        if (next !== card.dataset.state) paint(card, next);
      });
    });
  });
})();
</script>
